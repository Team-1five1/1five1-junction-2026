services:
  bun-app:
    profiles: [backend]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://shield:shield_local_password@postgres:5432/shield_db
      REDIS_URL: redis://redis:6379
      WP_DEFAULT_WEBHOOK_URL: http://wordpress/wp-json/shield/v1/webhook
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./keys:/app/keys
    networks:
      - app-net
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:4000/api/ready');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: shield_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield_local_password
      POSTGRES_DB: shield_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: shield_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-net

  wordpress-db:
    image: mariadb:11
    container_name: wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wp_root_password_2026
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wp_user_password_2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  wordpress:
    image: wordpress:latest
    container_name: wordpress-app
    restart: unless-stopped
    depends_on:
      - wordpress-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wp_user_password_2026
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/shield-guard:/var/www/html/wp-content/plugins/shield-guard
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  db_data:
  wp_data:
